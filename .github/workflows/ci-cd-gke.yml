name: CI CD to GKE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_ID: gke-ram-project-001
  REGION: us-central1
  REPOSITORY: gke-repo
  IMAGE: hello-app
  CLUSTER: gke-cluster
  ZONE: us-central1-a

jobs:

  # ---------------- STAGE 1 : MAVEN BUILD ----------------
  build:
    name: Stage 1 - Maven Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JAR
        run: |
          echo "===== Building JAR ====="
          mvn clean package -DskipTests
          echo "===== JAR Build Completed ====="

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: target/*.jar


  # ---------------- STAGE 2 : DOCKER BUILD & PUSH ----------------
  docker:
    name: Stage 2 - Docker Build & Push
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-file
          path: target

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud (kubectl included)
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          echo "===== Docker Auth to Artifact Registry ====="
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          echo "===== Building Docker Image ====="
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest .

      - name: Push Docker Image
        run: |
          echo "===== Pushing Docker Image ====="
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest
          echo "===== Docker Push Completed ====="
  

  # ---------------- STAGE 3 : DEPLOY TO GKE ----------------
  deploy:
    name: Stage 3 - Deploy to GKE
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud (kubectl + gke auth plugin)
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: "gke-gcloud-auth-plugin"

      - name: Get GKE Credentials
        run: |
          echo "===== Fetching GKE Credentials ====="
          gcloud container clusters get-credentials $CLUSTER --zone $ZONE --project $PROJECT_ID

      - name: Apply Kubernetes Manifests
        run: |
          echo "===== Applying K8s Files ====="
          kubectl apply -f k8s/

      - name: Wait for Deployment Rollout
        run: |
          echo "===== Waiting for Deployment to be Ready ====="
          kubectl rollout status deployment/hello-app-deployment

      - name: Verify Pods and Service
        run: |
          echo "===== Pods ====="
          kubectl get pods -o wide
          echo "===== Services ====="
          kubectl get svc