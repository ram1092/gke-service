name: CI CD to GKE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_ID: gke-ram-project-001
  REGION: us-central1
  REPOSITORY: gke-repo
  IMAGE: hello-app
  CLUSTER: gke-cluster
  ZONE: us-central1-a

jobs:

  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Maven Package
        run: |
          echo "===== Building JAR ====="
          mvn clean package -DskipTests
          ls -lh target

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: target/*.jar


  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-file
          path: target

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure Docker
        run: |
          echo "===== Docker Auth for Artifact Registry ====="
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Docker Build
        run: |
          echo "===== Building Docker Image ====="
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest .
          docker images

      - name: Docker Push
        run: |
          echo "===== Pushing Docker Image ====="
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest


  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install GKE Auth Plugin
        run: |
          echo "===== Installing GKE Auth Plugin ====="
          sudo apt-get update
          sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin

      - name: Get GKE Credentials
        run: |
          echo "===== Fetching Cluster Credentials ====="
          gcloud container clusters get-credentials $CLUSTER --zone $ZONE --project $PROJECT_ID

      - name: Apply Kubernetes Manifests
        run: |
          echo "===== Deploying to GKE ====="
          kubectl apply -f k8s/
          kubectl get pods
          kubectl get svc