name: CI CD to GKE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# ✅ REQUIRED FOR OIDC (MOST IMPORTANT FIX)
permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: gke-ram-project-001
  REGION: us-central1
  REPOSITORY: gke-repo
  IMAGE: hello-app
  CLUSTER: gke-cluster
  ZONE: us-central1-a

jobs:

  # ---------------- STAGE 1 : MAVEN BUILD ----------------
  build:
    name: Stage 1 - Maven Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: target/*.jar


  # ---------------- STAGE 2 : DOCKER BUILD & PUSH ----------------
  docker:
    name: Stage 2 - Docker Build & Push
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-file
          path: target

      # ❌ OLD KEY BASED AUTH (DO NOT USE)
      # - uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # ✅ OIDC AUTH
      - name: Authenticate to GCP using OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest .

      - name: Push Docker Image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest


  # ---------------- STAGE 3 : DEPLOY TO GKE ----------------
  deploy:
    name: Stage 3 - Deploy to GKE
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      # ❌ OLD KEY BASED AUTH (DO NOT USE)
      # - uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # ✅ OIDC AUTH
      - name: Authenticate to GCP using OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup gcloud with GKE plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: "gke-gcloud-auth-plugin"

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials $CLUSTER --zone $ZONE --project $PROJECT_ID

      - name: Apply Kubernetes Manifests
        run: kubectl apply -f k8s/

      - name: Wait for Deployment Rollout
        run: kubectl rollout status deployment/hello-app-deployment

      - name: Verify Pods and Service
        run: |
          kubectl get pods -o wide
          kubectl get svc