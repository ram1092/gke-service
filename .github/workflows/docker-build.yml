name: CI-CD to GKE (Stage Wise)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_ID: gke-ram-project-001
  REGION: us-central1
  REPOSITORY: gke-repo
  IMAGE: hello-app
  CLUSTER: gke-cluster
  ZONE: us-central1-a

jobs:

  build:
    name: 🧱 Stage 1 - Maven Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JAR
        run: |
          echo "Building JAR..."
          mvn clean package -DskipTests
          echo "Maven build completed"

      # ✅ Upload JAR for next job
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker:
    name: 🐳 Stage 2 - Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # ✅ Download JAR from previous job
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure Docker for Artifact Registry
        run: |
          echo "Configuring docker for Artifact Registry"
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          echo "Building Docker image"
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest .

      - name: Push Docker image
        run: |
          echo "Pushing Docker image"
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest
          echo "Docker push completed"

  deploy:
    name: 🚀 Stage 3 - Deploy to GKE
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Get GKE credentials
        run: |
          echo "Fetching GKE credentials"
          gcloud container clusters get-credentials $CLUSTER --zone $ZONE --project $PROJECT_ID

      - name: Deploy to GKE
        run: |
          echo "Applying Kubernetes manifests"
          kubectl apply -f k8s/
          echo "Deployment applied to GKE"